name: Build Windows EXE

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install nuitka zstandard pillow
      
      - name: Build EXE with Nuitka
        run: |
          python -m nuitka --onefile --windows-disable-console             --lto=yes --jobs=4             --output-filename=DiskCleaner             --remove-output             --assume-yes-for-downloads             --include-module=tkinter             --include-module=tkinter.ttk             --include-module=tkinter.filedialog             --include-module=tkinter.messagebox             --standalone             disk_cleaner.py
        shell: bash
      
      - name: Check EXE size
        shell: pwsh
        run: |
           = Get-Item DiskCleaner.exe
           = [math]::Round(.Length / 1MB, 2)
          Write-Host EXE Size: MB
          if ( -gt 10) {
            Write-Host WARNING: Size is larger than expected! -ForegroundColor Yellow
          }
      
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskCleaner-EXE
          path: DiskCleaner.exe
          retention-days: 30
