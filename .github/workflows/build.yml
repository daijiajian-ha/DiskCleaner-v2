name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install nuitka zstandard pillow
      
      - name: Build EXE with Nuitka
        run: |
          python -m nuitka --onefile --windows-disable-console --standalone --lto=yes --jobs=4 --output-filename=DiskCleaner --remove-output --assume-yes-for-downloads --include-module=tkinter --include-module=tkinter.ttk --include-module=tkinter.filedialog --include-module=tkinter.messagebox disk_cleaner.py
        shell: bash
      
      - name: Check EXE size
        shell: pwsh
        run: |
          $file = Get-Item DiskCleaner.exe
          $sizeMB = [math]::Round($file.Length / 1MB, 2)
          Write-Host "EXE Size: $sizeMB MB"
      
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskCleaner-EXE
          path: DiskCleaner.exe
          retention-days: 30
